name: GoWill CI

on:
  push:
    branches:
      - feature/gowill-marketplace
  pull_request:
    branches:
      - feature/gowill-marketplace

permissions:
  contents: write

concurrency:
  group: gowill-marketplace-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate GoWill marketplace and build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://ltvbbmazvgvgaujswtux.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_un0gh9csvkNJ_P5P28lyIQ_JEST0v2j
      NEXT_PUBLIC_BASE_URL: http://localhost:3000
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Synchronize npm lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Commit synchronized lockfile
        if: github.event_name == 'push'
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore: synchronize npm lockfile"
            git push
          fi

      - name: Install dependencies
        run: npm ci

      - name: Full repository ESLint audit
        run: npm run lint
        continue-on-error: true

      - name: Lint marketplace, shipping and authentication changes
        run: |
          npx eslint \
            "src/app/(store)/deposer/page.tsx" \
            "src/app/(store)/account/annonces/[id]/modifier/page.tsx" \
            "src/app/(store)/account/annonces/page.tsx" \
            "src/app/(store)/account/expedition/page.tsx" \
            "src/app/(store)/account/settings/page.tsx" \
            "src/app/(store)/annonces/page.tsx" \
            "src/app/(store)/annonces/[id]/page.tsx" \
            "src/app/(store)/checkout/page.tsx" \
            "src/app/(store)/checkout/success/page.tsx" \
            "src/app/(store)/cart/page.tsx" \
            "src/app/(store)/policies/shipping/page.tsx" \
            "src/app/(store)/auth/register/page.tsx" \
            "src/app/(store)/auth/reset-password/page.tsx" \
            "src/app/api/shipping/rates/route.ts" \
            "src/components/listings/buy-listing-button.tsx" \
            "src/components/cart/cart-summary.tsx" \
            "src/hooks/use-mounted.ts" \
            "src/lib/shipping.ts" \
            "src/lib/listing-policy.ts" \
            "src/lib/validators/index.ts" \
            "src/store/cart.ts" \
            "src/types/index.ts"

      - name: Build Next.js application
        run: npm run build
